<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | EcoMind</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white">
    <div class="max-w-md mx-auto pt-20">
        <h1 class="text-3xl font-bold mb-6">Login</h1>
        <form method="POST">
            <input type="text" name="phone" placeholder="Phone Number" class="block w-full mb-4 p-2 bg-slate-800 rounded">
            <input type="password" name="password" placeholder="Password" class="block w-full mb-4 p-2 bg-slate-800 rounded">
            <button type="submit" class="bg-green-500 p-2 rounded">Login</button>
        </form>
        <a href="/register">Register</a>
    </div>
</body>
</html>
